```html
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
    crossorigin="anonymous">

  <title>To Do List</title>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">

    <a class="navbar-brand" href="/">To Do List</a>

    <button class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <ul class="navbar-nav mr-auto">

        <li class="nav-item active">
          <a class="nav-link" href="/">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>

      </ul>

    </div>

  </nav>


  <!-- Add Todo Form -->
  <div class="container my-5">

    <h2>ADD YOUR TO DO</h2>

    <form action="/add" method="POST">

      <div class="mb-3">

        <label for="title" class="form-label">
          To do title
        </label>

        <input
          type="text"
          name="title"
          class="form-control"
          id="title"
          required>

        <div class="form-text">
          Write your to dos
        </div>

      </div>


      <div class="mb-3">

        <label for="desc" class="form-label">
          To do description
        </label>

        <input
          type="text"
          name="desc"
          class="form-control"
          id="desc"
          required>

      </div>


      <button type="submit" class="btn btn-primary">
        Submit
      </button>

    </form>

  </div>


  <!-- Todo Table -->
  <div class="container my-5">

    <h2>YOUR TO DOS</h2>

    <table class="table">

      <thead>

        <tr>

          <th scope="col">S-NO.</th>

          <th scope="col">Title</th>

          <th scope="col">Description</th>

          <th scope="col">Date Created</th>

        </tr>

      </thead>


      <tbody>

        {% for todo in todos %}

<tr>

  <!-- Serial number -->
  <th scope="row">
    {{ loop.index }}
  </th>

  <!-- Title -->
  <td>
    {{ todo[1] }}
  </td>

  <!-- Description -->
  <td>
    {{ todo[2] }}
  </td>

  <!-- Date -->
  <td>
    {{ todo[3] }}
  </td>

  <!-- Delete button -->
  <td>
    <form action="/delete/{{ todo[0] }}" method="POST">
      <button type="submit" class="btn btn-danger btn-sm">
        Delete
      </button>
    </form>
  </td>

</tr>

{% endfor %}

      </tbody>

    </table>

  </div>


  <!-- Optional JavaScript -->

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
    integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
    crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3RnW7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6jv8LEHfe/JQGiRRSQQQQQQQQQQQQQQQQQQQQQQQQQQQQ"
    crossorigin="anonymous"></script>

</body>

</html>
```
